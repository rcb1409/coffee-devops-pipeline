---
- name: Install local public SSH key on all hosts (enable passwordless SSH)
  hosts: all
  gather_facts: false
  vars: {}

  tasks:
    - name: Read local public key
      set_fact:
        pubkey: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"

    - name: Ensure remote .ssh directory exists
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Add public key to user's authorized_keys
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ pubkey }}"
        state: present
