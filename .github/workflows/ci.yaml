name: CI Pipeline

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - "release/**"

jobs:
  quality:
    name: Lint + Test + Coverage
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit and fix vulnerabilities
        run: |
          echo "🔒 Running security audit..."
          npm audit fix --force || true
          npm audit --audit-level=moderate || true
          echo "✅ Security audit completed"

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests + Coverage (NYC)
        run: npm test

  build_and_push:
    name: Build & Push Docker Image to Docker Hub
    needs: quality
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for image tagging
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USER }}/coffee
          tags: |
            type=raw,value=stage_d-${{ github.sha }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Blue-Green Deployment
    needs: build_and_push
    runs-on: [self-hosted, macOS, X64]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo " SSH private key configured"

      - name: Setup SSH Known Hosts
        run: |
          # Extract IPs from inventory file and add to known_hosts
          echo " Adding VM IPs to known_hosts..."
          for ip in $(grep 'ansible_host:' ansible/inventory.yml | awk '{print $2}'); do
            echo "  - $ip"
            ssh-keyscan -H "$ip" >> ~/.ssh/known_hosts 2>&1 || echo "Warning: Could not scan $ip"
          done
          echo " SSH setup complete"

      - name: Verify Ansible Installation
        run: |
          echo " Checking Ansible installation..."
          ansible --version
          echo " Ansible is available"

      - name: Run Setup (if needed)
        run: |
          echo "🔧 Running setup to ensure Docker and prerequisites are installed..."
          ansible-playbook -i ansible/inventory.yml ansible/deploy.yml --tags setup --private-key ~/.ssh/deploy_key || echo "Setup completed or already done"

      - name: Run Blue-Green Deployment with Rollback Support
        id: deploy
        run: |
          echo "🚀 Starting Blue-Green Deployment..."
          if ansible-playbook -i ansible/inventory.yml ansible/deploy.yml --private-key ~/.ssh/deploy_key; then
            echo "✅ Deployment completed successfully"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            DEPLOY_EXIT_CODE=$?
            echo "⚠️  Deployment playbook exited with code: $DEPLOY_EXIT_CODE"
            echo "Checking if rollback was triggered..."
            
            # Check if rollback state file exists (indicates rollback may have occurred)
            echo "deployment_status=rollback_triggered" >> $GITHUB_OUTPUT
            exit $DEPLOY_EXIT_CODE
          fi

      - name: Verify Deployment Status
        if: steps.deploy.outcome == 'success'
        run: |
          echo "🔍 Verifying deployment..."
          sleep 5
          
          # Extract load balancer IP from inventory
          LB_IP=$(grep -A3 'lb:' ansible/inventory.yml | grep 'ansible_host:' | head -1 | awk '{print $2}')
          echo "Load balancer IP: $LB_IP"
          
          if [ -z "$LB_IP" ]; then
            echo "❌ Failed to extract load balancer IP"
            exit 1
          fi
          
          echo "Testing health endpoint..."
          if curl -f "http://$LB_IP/health"; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            exit 1
          fi
          
          echo "Checking deployment status..."
          curl -s "http://$LB_IP/status"
          
          echo "✅ Deployment verified successfully!"

      - name: Report Rollback Status
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🔄 Deployment failed - Rollback may have been triggered"
          echo ""
          echo "## ⚠️ Deployment Rollback Alert" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment failed health checks after switching environments." >> $GITHUB_STEP_SUMMARY
          echo "An automatic rollback has been executed to restore the previous environment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:**" >> $GITHUB_STEP_SUMMARY
          echo "- Review the deployment logs above" >> $GITHUB_STEP_SUMMARY
          echo "- Check application health and logs" >> $GITHUB_STEP_SUMMARY
          echo "- Verify the rollback was successful" >> $GITHUB_STEP_SUMMARY
          echo "- Investigate why the new deployment failed health checks" >> $GITHUB_STEP_SUMMARY
          
          # Extract load balancer IP for status check
          LB_IP=$(grep -A3 'lb:' ansible/inventory.yml | grep 'ansible_host:' | head -1 | awk '{print $2}')
          if [ -n "$LB_IP" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Current Status:**" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            curl -s "http://$LB_IP/status" >> $GITHUB_STEP_SUMMARY || echo "Unable to fetch status" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi
