# Prometheus Alert Rules for Coffee Delivery Service

groups:
  - name: deployment_alerts
    interval: 30s
    rules:
      # Alert when deployment fails
      - alert: DeploymentHealthCheckFailed
        expr: up{job=~"coffee-app-.*"} == 0
        for: 1m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: "Deployment health check failed"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

      # Alert when service is down
      - alert: ServiceDown
        expr: up{job=~"coffee-app-.*"} == 0
        for: 2m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Coffee service is down"
          description: "{{ $labels.instance }} ({{ $labels.environment }}) has been down for more than 2 minutes"

  - name: performance_alerts
    interval: 30s
    rules:
      # Alert on high error rate
      - alert: HighErrorRate
        expr: |
          rate(http_request_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      # Alert on slow response times
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Slow response times detected"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.instance }}"

      # Alert on very slow response times
      - alert: VerySlowResponseTime
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: critical
          component: performance
        annotations:
          summary: "Very slow response times"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.instance }}"

  - name: blue_green_alerts
    interval: 30s
    rules:
      # Alert when Blue-Green switch takes too long
      - alert: BlueGreenSwitchDurationHigh
        expr: |
          histogram_quantile(0.95, rate(blue_green_switch_duration_seconds_bucket[5m])) > 60
        for: 1m
        labels:
          severity: warning
          component: deployment
        annotations:
          summary: "Blue-Green switch taking too long"
          description: "95th percentile switch duration is {{ $value }}s"

      # Alert when deployment duration is high
      - alert: DeploymentDurationHigh
        expr: |
          histogram_quantile(0.95, rate(deployment_duration_seconds_bucket[5m])) > 300
        for: 1m
        labels:
          severity: warning
          component: deployment
        annotations:
          summary: "Deployment taking too long"
          description: "95th percentile deployment duration is {{ $value }}s for {{ $labels.environment }}"

      # Alert when both environments are unhealthy
      - alert: BothEnvironmentsUnhealthy
        expr: |
          (up{job="coffee-app-blue"} == 0) and (up{job="coffee-app-green"} == 0)
        for: 1m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: "Both Blue and Green environments are down"
          description: "Both environments are unhealthy. Service is unavailable."

  - name: application_alerts
    interval: 30s
    rules:
      # Alert when no orders are being processed (potential issue)
      - alert: NoOrdersProcessed
        expr: |
          rate(coffee_orders_total[10m]) == 0
        for: 10m
        labels:
          severity: info
          component: application
        annotations:
          summary: "No orders processed in last 10 minutes"
          description: "No coffee orders have been placed in the last 10 minutes"

      # Alert on high request rate (potential load issue)
      - alert: HighRequestRate
        expr: |
          rate(http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High request rate detected"
          description: "Request rate is {{ $value }} requests/second for {{ $labels.instance }}"

