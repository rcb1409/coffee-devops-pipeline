# Prometheus Configuration for Coffee Delivery Service
global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'coffee-pipeline'
    environment: 'staging'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'  # Alertmanager will run on port 9093

# Load alert rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus-server'

  # Blue Environment
  - job_name: 'coffee-app-blue'
    static_configs:
      - targets: ['152.7.177.21:3000']
        labels:
          environment: 'blue'
          instance: 'coffee-blue'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Green Environment
  - job_name: 'coffee-app-green'
    static_configs:
      - targets: ['152.7.177.84:3000']
        labels:
          environment: 'green'
          instance: 'coffee-green'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Load Balancer (if Nginx metrics available)
  - job_name: 'nginx-loadbalancer'
    static_configs:
      - targets: ['152.7.177.63:9113']  # nginx-exporter port
        labels:
          instance: 'loadbalancer'
    scrape_interval: 15s
    scrape_timeout: 10s

